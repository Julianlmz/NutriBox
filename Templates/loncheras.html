<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Loncheras - NutriBox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            background-image: radial-gradient(circle at 80% 10%, rgba(76, 175, 80, 0.08) 0%, rgba(255, 255, 255, 0) 60%);
            min-height: 100vh;
        }

        /* NAVBAR SUPERIOR */
        .navbar {
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .navbar-brand img { mix-blend-mode: multiply; }

        /* SIDEBAR (MENÚ LATERAL) */
        .offcanvas {
            border-top-right-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
        }

        .offcanvas-header .logo-mini {
            height: 35px;
            mix-blend-mode: multiply;
        }

        /* ESTILOS DEL LINK DEL MENÚ */
        .nav-link {
            border-radius: 15px; /* Bordes bien redondeados como en la foto */
            padding: 14px 20px;
            color: #6c757d;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .nav-link i {
            font-size: 1.1rem;
            width: 30px;
            text-align: center;
            margin-right: 8px;
        }

        /* --- ESTILO EXACTO DE TU CAPTURA (ACTIVO) --- */
        .nav-link.active {
            background-color: #e8f5e9 !important; /* El verde pastel de fondo */
            color: #2e7d32 !important; /* El verde oscuro del texto */
            font-weight: 700;
        }

        .nav-link.active i {
            color: #2e7d32 !important; /* Icono también verde oscuro */
        }

        /* Hover normal */
        .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
            color: #4CAF50;
        }

        /* TARJETAS DE CONTENIDO */
        .content-card {
            border: none;
            border-radius: 25px;
            background: white;
            padding: 2.5rem;
            height: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transition: transform 0.3s ease;
        }

        /* FORMULARIOS */
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border: 1px solid #eee;
        }
        .form-control:focus {
            background-color: white;
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-save:hover {
            background-color: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        /* LISTA DE ITEMS */
        .card-lonchera-item {
            border: 1px solid #f0f0f0;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: #fff;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-lonchera-item:hover {
            border-color: #4CAF50;
            background-color: #f1f8e9;
            transform: scale(1.01);
        }
        .btn-action {
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4 py-1">
            <div class="d-flex align-items-center">
                <button class="btn btn-light border-0 bg-transparent p-2 me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                    <i class="fas fa-bars fs-4 text-secondary"></i>
                </button>
                <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="dashboard.html" style="color: #4CAF50;">
                    <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg"
                         alt="NutriBox Logo"
                         style="height: 45px; mix-blend-mode: multiply;"
                         class="me-2">
                    NutriBox
                </a>
            </div>
            <button id="logout-button" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-bold d-none d-lg-block" style="border-width: 2px;">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>
    </header>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header border-bottom p-4">
            <h5 class="offcanvas-title fw-bold fs-4 d-flex align-items-center" style="color: #4CAF50;">
                <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg"
                     alt="Logo Mini"
                     class="logo-mini me-2">
                Menú
            </h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-4">
            <ul class="navbar-nav fs-5">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i>Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="loncheras.html"><i class="fas fa-box-open"></i>Mis Loncheras</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="alimentos.html"><i class="fas fa-carrot"></i>Alimentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="fas fa-user-circle"></i>Mi Perfil</a>
                </li>

                <li class="nav-item mt-auto pt-4 border-top d-lg-none">
                    <button id="logout-button-mobile" class="btn btn-danger w-100 rounded-pill py-3 fw-bold">
                        <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <main class="container my-5">
        <div class="row g-5">

            <div class="col-lg-5">
                <div class="content-card h-100">
                    <h3 class="fw-bold mb-4 d-flex align-items-center" style="color: #2e7d32;">
                        <i class="fas fa-plus-circle me-2 text-success"></i>
                        Nueva Lonchera
                    </h3>
                    <form id="form-crear-lonchera">
                        <div class="mb-3">
                            <label for="lonchera-nombre" class="form-label fw-bold small text-secondary ms-1">Nombre</label>
                            <input type="text" class="form-control" id="lonchera-nombre" placeholder="Ej: Lonchera de Lunes" required>
                        </div>
                        <div class="mb-4">
                            <label for="lonchera-descripcion" class="form-label fw-bold small text-secondary ms-1">Descripción</label>
                            <textarea class="form-control" id="lonchera-descripcion" placeholder="¿Qué contiene? (Opcional)" style="height: 120px" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-save shadow-sm">
                            <i class="fas fa-save me-2"></i> Guardar Lonchera
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="content-card h-100">
                    <h3 class="fw-bold mb-4 d-flex align-items-center" style="color: #2e7d32;">
                        <i class="fas fa-list-ul me-2 text-success"></i>
                        Mis Loncheras
                    </h3>
                    <div id="lista-loncheras">
                        <div class="text-center py-5 text-muted">
                            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                            <p>Cargando tus loncheras...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditarLonchera" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-success">Editar Lonchera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-editar-lonchera">
                        <input type="hidden" id="edit-lonchera-id">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Nombre</label>
                            <input type="text" class="form-control" id="edit-lonchera-nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">Descripción</label>
                            <textarea class="form-control" id="edit-lonchera-descripcion" style="height: 100px" required></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success rounded-pill px-4">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/loncheras.js"></script>
</body>
</html>
