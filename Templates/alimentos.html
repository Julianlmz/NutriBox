<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Alimentos - NutriBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Frontend/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <button class="btn btn-outline-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                    <i class="fas fa-bars"></i>
                </button>
                <a class="navbar-brand text-primary-nb fw-bold fs-1 mx-auto" href="dashboard.html">
                    <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg" alt="NutriBox Logo" style="height: 90px;">
                    NutriBox
                </a>
                <button id="logout-button" class="btn btn-outline-danger d-none d-lg-flex">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </button>
            </div>
        </nav>
    </header>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-primary-nb fw-bold fs-3" id="sidebarMenuLabel">NutriBox</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="navbar-nav fs-5">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-home me-2"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="loncheras.html"><i class="fas fa-box-open me-2"></i>Loncheras</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="alimentos.html"><i class="fas fa-apple-alt me-2"></i>Alimentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="fas fa-user me-2"></i>Perfil</a>
                </li>
                <li class="nav-item d-lg-none mt-3">
                    <button id="logout-button-mobile" class="btn btn-outline-danger w-100">Cerrar Sesión</button>
                </li>
            </ul>
        </div>
    </div>

    <main class="container my-5">
        <h1 class="fw-bold mb-4">Gestión de Alimentos</h1>
        <div class="row g-5">

            <div class="col-12 col-lg-5">
                <div class="card border-0 card-shadow h-100">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-3">
                            <i class="fas fa-plus-circle text-primary-nb me-2"></i>
                            Crear Nuevo Alimento
                        </h3>
                        <form id="form-crear-alimento" enctype="multipart/form-data">

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="alimento-nombre" placeholder="Nombre" required>
                                        <label for="alimento-nombre">Nombre</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <select class="form-select" id="alimento-categoria" required>
                                            </select>
                                        <label for="alimento-categoria">Categoría</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="mt-3 mb-2">Valores Nutricionales (por 100g)</h5>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.1" class="form-control" id="alimento-calorias" placeholder="Calorías" required>
                                        <label for="alimento-calorias">Calorías</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.1" class="form-control" id="alimento-proteinas" placeholder="Proteínas" required>
                                        <label for="alimento-proteinas">Proteínas (g)</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.1" class="form-control" id="alimento-carbohidratos" placeholder="Carbohidratos" required>
                                        <label for="alimento-carbohidratos">Carbohidratos (g)</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.1" class="form-control" id="alimento-grasas" placeholder="Grasas" required>
                                        <label for="alimento-grasas">Grasas (g)</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="mt-3 mb-2">Comercial</h5>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.01" class="form-control" id="alimento-precio" placeholder="Precio" required>
                                        <label for="alimento-precio">Precio Unitario</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="number" class="form-control" id="alimento-stock" placeholder="Stock Inicial" required>
                                        <label for="alimento-stock">Stock Inicial (unidades)</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="alimento-imagen" class="form-label">Imagen del Alimento (Opcional)</label>
                                <input class="form-control" type="file" id="alimento-imagen" accept="image/*">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-nb btn-lg">
                                    Guardar Alimento
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-7">
                <div class="card border-0 card-shadow h-100">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-3">
                            <i class="fas fa-list text-primary-nb me-2"></i>
                            Lista de Alimentos
                        </h3>

                        <div id="lista-alimentos">
                            <p class="text-muted text-center" id="alimentos-loading">Cargando alimentos...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditarAlimento" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarLabel">Editar Alimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="form-editar-alimento" enctype="multipart/form-data">
                    <div class="modal-body">
                        <input type="hidden" id="edit-alimento-id">

                        <div class="row">
                            <div class="col-md-4 text-center">
                                <h6 class="text-muted">Imagen Actual</h6>
                                <img id="edit-alimento-imagen-preview" src="" alt="Imagen del Alimento" style="max-width: 150px; height: auto; border-radius: 8px;" class="mb-3">
                                <input class="form-control" type="file" id="edit-alimento-imagen-file" accept="image/*">
                            </div>
                            <div class="col-md-8">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="edit-alimento-nombre" placeholder="Nombre" required>
                                    <label for="edit-alimento-nombre">Nombre</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <select class="form-select" id="edit-alimento-categoria" required>
                                    </select>
                                    <label for="edit-alimento-categoria">Categoría</label>
                                </div>
                            </div>
                        </div>

                        <h5 class="mt-3 mb-2">Valores Nutricionales (por 100g)</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" step="0.1" class="form-control" id="edit-alimento-calorias" required>
                                    <label for="edit-alimento-calorias">Calorías</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" step="0.1" class="form-control" id="edit-alimento-proteinas" required>
                                    <label for="edit-alimento-proteinas">Proteínas (g)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" step="0.1" class="form-control" id="edit-alimento-carbohidratos" required>
                                    <label for="edit-alimento-carbohidratos">Carbohidratos (g)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" step="0.1" class="form-control" id="edit-alimento-grasas" required>
                                    <label for="edit-alimento-grasas">Grasas (g)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" step="0.01" class="form-control" id="edit-alimento-precio" required>
                                    <label for="edit-alimento-precio">Precio Unitario</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="number" class="form-control" id="edit-alimento-stock" required>
                                    <label for="edit-alimento-stock">Stock Actual</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary-nb">Guardar Cambios</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../Frontend/js/auth-guard.js"></script>
    <script src="../Frontend/js/alimentos.js"></script> </body>
</html>
