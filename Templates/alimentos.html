<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Alimentos - NutriBox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            background-image: radial-gradient(circle at 80% 10%, rgba(76, 175, 80, 0.08) 0%, rgba(255, 255, 255, 0) 60%);
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .navbar-brand img { mix-blend-mode: multiply; }

        /* SIDEBAR */
        .offcanvas {
            border-top-right-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
        }
        .offcanvas-header .logo-mini { height: 35px; mix-blend-mode: multiply; }

        .nav-link {
            border-radius: 12px;
            padding: 14px 20px;
            color: #6c757d;
            font-weight: 500;
            transition: all 0.25s ease;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .nav-link i { font-size: 1.1rem; width: 30px; text-align: center; margin-right: 8px; }

        /* Link Activo */
        .nav-link.active {
            background-color: #e8f5e9 !important;
            color: #2e7d32 !important;
            font-weight: 700;
        }
        .nav-link.active i { color: #2e7d32 !important; }

        .nav-link:hover:not(.active) {
            background-color: #f8f9fa;
            color: #4CAF50;
        }

        /* TARJETAS */
        .content-card {
            border: none;
            border-radius: 25px;
            background: white;
            padding: 2rem;
            height: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transition: transform 0.3s ease;
        }
        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        /* FORMULARIOS */
        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 15px;
            background-color: #f8f9fa;
            border: 1px solid #eee;
            font-size: 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            background-color: white;
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 0.4rem;
            margin-left: 0.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4CAF50;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 5px;
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
            margin-top: 1.5rem;
        }
        .btn-save:hover {
            background-color: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        /* ITEMS DE LISTA */
        .card-alimento-item {
            border: 1px solid #f0f0f0;
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #fff;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .card-alimento-item:hover {
            border-color: #4CAF50;
            background-color: #f1f8e9;
            transform: scale(1.01);
        }
        .alimento-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 15px;
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <header class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4 py-1">
            <div class="d-flex align-items-center">
                <button class="btn btn-light border-0 bg-transparent p-2 me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                    <i class="fas fa-bars fs-4 text-secondary"></i>
                </button>

                <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="dashboard.html" style="color: #4CAF50;">
                    <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg"
                         alt="NutriBox Logo"
                         style="height: 45px; mix-blend-mode: multiply;"
                         class="me-2">
                    NutriBox
                </a>
            </div>
            <button id="logout-button" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-bold d-none d-lg-block" style="border-width: 2px;">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
            </button>
        </div>
    </header>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header border-bottom p-4">
            <h5 class="offcanvas-title fw-bold fs-4 d-flex align-items-center" style="color: #4CAF50;">
                <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg"
                     alt="Logo Mini"
                     class="logo-mini me-2">
                Menú
            </h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-4">
            <ul class="navbar-nav fs-5">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="loncheras.html"><i class="fas fa-box-open"></i>Mis Loncheras</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="alimentos.html"><i class="fas fa-carrot"></i>Alimentos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="fas fa-user-circle"></i>Mi Perfil</a>
                </li>
                <li class="nav-item mt-auto pt-4 border-top d-lg-none">
                    <button id="logout-button-mobile" class="btn btn-danger w-100 rounded-pill py-3 fw-bold">
                        <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <main class="container my-5">
        <div class="row g-5">

            <div class="col-lg-5">
                <div class="content-card h-100">
                    <h3 class="fw-bold mb-4 d-flex align-items-center" style="color: #2e7d32;">
                        <i class="fas fa-plus-circle me-2 text-success"></i>
                        Nuevo Alimento
                    </h3>

                    <form id="form-crear-alimento" enctype="multipart/form-data">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="alimento-nombre" placeholder="Ej: Manzana" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Categoría</label>
                                <select class="form-select" id="alimento-categoria" required></select>
                            </div>
                        </div>

                        <div class="section-title">Nutrición (por 100g)</div>

                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label">Calorías</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="alimento-calorias" placeholder="0" required>
                                    <span class="input-group-text bg-light border-start-0 text-muted" style="font-size: 0.8rem;">kcal</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Proteínas</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="alimento-proteinas" placeholder="0" required>
                                    <span class="input-group-text bg-light border-start-0 text-muted" style="font-size: 0.8rem;">g</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Carbos</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="alimento-carbohidratos" placeholder="0" required>
                                    <span class="input-group-text bg-light border-start-0 text-muted" style="font-size: 0.8rem;">g</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Grasas</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="alimento-grasas" placeholder="0" required>
                                    <span class="input-group-text bg-light border-start-0 text-muted" style="font-size: 0.8rem;">g</span>
                                </div>
                            </div>
                        </div>

                        <input type="hidden" id="alimento-precio" value="0">
                        <input type="hidden" id="alimento-stock" value="0">

                        <div class="mt-3">
                            <label class="form-label">Imagen (Opcional)</label>
                            <input class="form-control" type="file" id="alimento-imagen" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-save shadow-sm">
                            Guardar Alimento
                        </button>

                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="content-card h-100">
                    <h3 class="fw-bold mb-4 d-flex align-items-center" style="color: #2e7d32;">
                        <i class="fas fa-list-ul me-2 text-success"></i>
                        Catálogo
                    </h3>
                    <div id="lista-alimentos">
                        <div class="text-center py-5 text-muted">
                            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                            <p id="alimentos-loading">Cargando alimentos...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditarAlimento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-success">Editar Alimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form id="form-editar-alimento" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <input type="hidden" id="edit-alimento-id">

                        <div class="row">
                            <div class="col-md-4 text-center mb-3 mb-md-0">
                                <label class="form-label d-block mb-2">Imagen Actual</label>
                                <img id="edit-alimento-imagen-preview" src="" alt="Preview"
                                     style="width: 150px; height: 150px; object-fit: cover; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);"
                                     class="mb-3">
                                <input class="form-control form-control-sm" type="file" id="edit-alimento-imagen-file" accept="image/*">
                            </div>

                            <div class="col-md-8">
                                <div class="row g-3 mb-3">
                                    <div class="col-12">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="edit-alimento-nombre" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Categoría</label>
                                        <select class="form-select" id="edit-alimento-categoria" required></select>
                                    </div>
                                </div>

                                <div class="section-title mt-0">Nutrición</div>
                                <div class="row g-2">
                                    <div class="col-3">
                                        <label class="form-label small">Cal</label>
                                        <input type="number" class="form-control" id="edit-alimento-calorias" required>
                                    </div>
                                    <div class="col-3">
                                        <label class="form-label small">Prot</label>
                                        <input type="number" class="form-control" id="edit-alimento-proteinas" required>
                                    </div>
                                    <div class="col-3">
                                        <label class="form-label small">Carb</label>
                                        <input type="number" class="form-control" id="edit-alimento-carbohidratos" required>
                                    </div>
                                    <div class="col-3">
                                        <label class="form-label small">Gras</label>
                                        <input type="number" class="form-control" id="edit-alimento-grasas" required>
                                    </div>
                                </div>

                                <input type="hidden" id="edit-alimento-precio" value="0">
                                <input type="hidden" id="edit-alimento-stock" value="0">
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success rounded-pill px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/alimentos.js"></script>
</body>
</html>
