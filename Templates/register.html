<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NutriBox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        /* --- COLORES --- */
        :root {
            --primary-nb: #4CAF50;
            --primary-dark-nb: #388E3C;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Utilidades */
        .text-primary-nb { color: var(--primary-nb) !important; }
        .btn-primary-nb {
            background-color: var(--primary-nb);
            border-color: var(--primary-nb);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary-nb:hover {
            background-color: var(--primary-dark-nb);
            border-color: var(--primary-dark-nb);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        /* --- FONDO DIFUMINADO --- */
        .bg-blobs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .blob-green {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 50%;
            height: 60%;
            background: radial-gradient(circle, rgba(76,175,80,0.2) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
        }
        .blob-blue {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 60%;
            height: 70%;
            background: radial-gradient(circle, rgba(33,150,243,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
        }

        /* --- TARJETA --- */
        .card-login-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border-radius: 25px;
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #eee;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: var(--primary-nb);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob-green"></div>
        <div class="blob-blue"></div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <div class="card p-4 p-sm-5 card-login-container">

                    <div class="text-center mb-4">
                        <div class="mb-2 text-primary-nb">
                            <i class="fas fa-leaf fa-3x"></i>
                        </div>
                        <h1 class="h3 fw-bold text-primary-nb mb-0 ls-1">NutriBox</h1>
                        <p class="text-muted small mt-2">Crea tu cuenta para comenzar.</p>
                    </div>

                    <!-- CORRECCIÓN: ID register-form para coincidir con JS y sin onsubmit -->
                    <form id="register-form">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control rounded-4" placeholder="Tu nombre" required>
                        </div>

                        <!-- CORRECCIÓN: Agregado campo Apellido requerido por register.js -->
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" id="apellido" class="form-control rounded-4" placeholder="Tu apellido" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control rounded-4" placeholder="nombre@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control rounded-4" placeholder="••••••••" required minlength="6">
                        </div>

                        <div class="mb-4">
                            <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="confirm-password" class="form-control rounded-4" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary-nb w-100 py-3 rounded-pill fw-bold fs-6 shadow-sm">
                            Crear Cuenta
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-2">
                            ¿Ya tienes una cuenta?
                        </p>
                        <a href="login.html" class="btn btn-outline-success rounded-pill w-100 fw-bold btn-sm py-2">
                            Iniciar Sesión
                        </a>
                        <div class="mt-3">
                            <a href="index.html" class="text-muted small text-decoration-none fw-medium">
                                <i class="fas fa-arrow-left me-1"></i> Volver al inicio
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/static/js/register.js"></script>

</body>
</html>
