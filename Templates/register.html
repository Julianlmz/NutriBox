<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NutriBox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            background-image: radial-gradient(circle at 10% 20%, rgb(232, 245, 233) 0%, rgb(255, 255, 255) 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar { padding: 15px 0; }

        /* Tarjeta flotante */
        .register-card {
            border: none;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            background: white;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px; /* Un poco más ancha que el login */
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border: 1px solid #eee;
        }

        .form-control:focus {
            background-color: white;
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .btn-register {
            background-color: #4CAF50;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #388E3C;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .auth-icon {
            width: 70px;
            height: 70px;
            background-color: #e8f5e9;
            color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 20px auto;
        }

        .form-label {
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>

    <header class="bg-transparent fixed-top">
        <div class="container mt-3">
            <nav class="navbar navbar-light">
                <a class="navbar-brand text-primary-nb fw-bold fs-3 d-flex align-items-center" href="/">
                    <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg"
                         alt="NutriBox Logo"
                         style="height: 60px; mix-blend-mode: multiply;"
                         class="me-2">
                    NutriBox
                </a>

                <a href="/" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="fas fa-arrow-left me-2"></i> Volver
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 mt-5">
        <div class="container d-flex justify-content-center">

            <div class="register-card text-center">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>

                <h2 class="fw-bold text-dark mb-1">Crear Cuenta</h2>
                <p class="text-muted mb-4 small">Únete a NutriBox y empieza a planificar</p>

                <form id="register-form">

                    <div class="row text-start">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary ps-2">Nombre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-4 ps-3 text-muted">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" id="nombre" placeholder="Ej: Juan" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary ps-2">Apellido</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-4 ps-3 text-muted">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" id="apellido" placeholder="Ej: Pérez" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold text-secondary ps-2">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 rounded-start-4 ps-3 text-muted">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0" id="email" placeholder="tucorreo@ejemplo.com" required>
                        </div>
                    </div>

                    <div class="row text-start">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary ps-2">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-4 ps-3 text-muted">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold text-secondary ps-2">Confirmar</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 rounded-start-4 ps-3 text-muted">
                                    <i class="fas fa-check-circle"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="confirm-password" placeholder="••••••••" required>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary text-white btn-register">
                            Registrarse
                        </button>
                    </div>

                </form>

                <div class="text-center border-top pt-3">
                    <p class="text-muted small mb-0">¿Ya tienes una cuenta?</p>
                    <a href="login.html" class="text-success fw-bold text-decoration-none">
                        Inicia sesión aquí
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/register.js"></script>

</body>
</html>
