<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Loncheras - NutriBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <header class="bg-white shadow-sm sticky-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <button class="btn btn-outline-success" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                    <i class="fas fa-bars"></i>
                </button>
                <a class="navbar-brand text-primary-nb fw-bold fs-1 mx-auto" href="dashboard.html">
                    <img src="https://i.pinimg.com/736x/2d/46/a7/2d46a70bbd931232f4b9afc799aaf977.jpg" alt="NutriBox Logo" style="height: 90px;">
                    NutriBox
                </a>
                <button id="logout-button" class="btn btn-outline-danger d-none d-lg-flex">
                    <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                </button>
            </div>
        </nav>
    </header>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-primary-nb fw-bold fs-3" id="sidebarMenuLabel">NutriBox</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="navbar-nav fs-5">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-home me-2"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="loncheras.html"><i class="fas fa-box-open me-2"></i>Loncheras</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="alimentos.html"><i class="fas fa-apple-alt me-2"></i>Alimentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="fas fa-user me-2"></i>Perfil</a>
                </li>
                <li class="nav-item d-lg-none mt-3">
                    <button id="logout-button-mobile" class="btn btn-outline-danger w-100">Cerrar Sesión</button>
                </li>
            </ul>
        </div>
    </div>

    <main class="container my-5">
        <div class="row g-5">

            <div class="col-md-5">
                <div class="card border-0 card-shadow h-100">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-3">
                            <i class="fas fa-plus-circle text-primary-nb me-2"></i>
                            Crear Nueva Lonchera
                        </h3>
                        <form id="form-crear-lonchera">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="lonchera-nombre" placeholder="Nombre" required>
                                <label for="lonchera-nombre">Nombre de la Lonchera</label>
                            </div>
                            <div class="form-floating mb-3">
                                <textarea class="form-control" id="lonchera-descripcion" placeholder="Descripción" style="height: 100px" required></textarea>
                                <label for="lonchera-descripcion">Descripción</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-nb btn-lg">Guardar Lonchera</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card border-0 card-shadow h-100">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-3">
                            <i class="fas fa-box-open text-primary-nb me-2"></i>
                            Mis Loncheras
                        </h3>
                        <div id="lista-loncheras">
                            <p class="text-muted text-center" id="loncheras-loading">Cargando loncheras...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditarLonchera" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarLabel">Editar Lonchera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-editar-lonchera">
                    <div class="modal-body">
                        <input type="hidden" id="edit-lonchera-id">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="edit-lonchera-nombre" placeholder="Nombre" required>
                            <label for="edit-lonchera-nombre">Nombre de la Lonchera</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" id="edit-lonchera-descripcion" placeholder="Descripción" style="height: 100px" required></textarea>
                            <label for="edit-lonchera-descripcion">Descripción</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary-nb">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/auth-guard.js"></script> <script src="js/loncheras.js"></script> </body>
</html>
